[package]
name = "tinyclass"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
dirs = "6.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ureq = { version = "3.4.0", features = ["json"] }
usage = { version = "6", package = "usage-rs", features = ["completions"] }
llama-cpp-2 = "0.1.157"

# Vulkan is the GPU backend everywhere but macOS, where llama.cpp turns Metal
# on by itself; cuda and rocm are opt-in for machines that have them
[target.'cfg(not(target_os = "macos"))'.dependencies]
llama-cpp-2 = { version = "0.1.157", features = ["vulkan"] }

[features]
cuda = ["llama-cpp-2/cuda"]
rocm = ["llama-cpp-2/rocm"]

[profile.release]
lto = true
codegen-units = 1
