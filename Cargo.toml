[package]
name = "tinyclass"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
dirs = "6.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ureq = { version = "3.4.0", features = ["json"] }
usage = { version = "6", package = "usage-rs", features = ["completions"] }
llama-cpp-2 = "0.1.157"

[features]
default = ["vulkan"]
vulkan = ["llama-cpp-2/vulkan"]
cuda = ["llama-cpp-2/cuda"]
metal = ["llama-cpp-2/metal"]
rocm = ["llama-cpp-2/rocm"]

[profile.release]
lto = true
codegen-units = 1
