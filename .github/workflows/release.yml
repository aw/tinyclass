name: Release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

# glibc rather than musl: llama.cpp's Vulkan backend is C++ against the
# system loader, and building that against musl isn't worth the fight. The
# macOS runner has cmake and the Metal toolchain already.
jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Install the llama.cpp build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake libvulkan-dev glslc spirv-headers

      - name: Install Rust for ${{ matrix.target }}
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
          rustup default stable

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        run: |
          archive="tinyclass-${{ github.ref_name }}-${{ matrix.target }}.tar.gz"
          strip "target/${{ matrix.target }}/release/tinyclass"
          tar czf "$archive" -C "target/${{ matrix.target }}/release" tinyclass
          sha256sum "$archive" > "$archive.sha256"
          echo "archive=$archive" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ env.archive }}
            ${{ env.archive }}.sha256
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: assets/*.tar.gz

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" assets/* --repo "$GITHUB_REPOSITORY" --generate-notes
